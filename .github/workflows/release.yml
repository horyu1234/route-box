name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag without assets yet, e.g. v0.3.1'
        required: true

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # 공급망 공격 방지를 위해 액션은 태그가 아니라 커밋 SHA 로 고정한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # shallow checkout 에서는 git describe 가 태그를 못 찾으므로 버전을 직접 넘긴다.
      - name: build
        run: make cross VERSION="$TAG"
      - name: package
        run: |
          cd dist
          for bin in routebox-*-*; do
            platform="${bin#routebox-}"
            mkdir -p "pkg-$platform"
            cp "$bin" "pkg-$platform/routebox"
            cp ../LICENSE "pkg-$platform/"
            # 같은 태그를 다시 빌드해도 sha256 이 같도록 시각·소유자를 고정한다.
            tar -C "pkg-$platform" --sort=name --mtime='1970-01-01 00:00:00Z' --owner=0 --group=0 --numeric-owner \
              -cf - routebox LICENSE | gzip -n > "routebox-$TAG-$platform.tar.gz"
          done
          sha256sum routebox-"$TAG"-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: check version stamp
        run: ./dist/routebox-linux-amd64 --version | grep -F "$TAG"
      - name: release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "RouteBox $TAG" --notes-from-tag
          # --clobber 없이 올린다: 이미 받은 사람과 formula 가 믿는 sha256 을 바꾸지 않는다.
          gh release upload "$TAG" dist/routebox-"$TAG"-*.tar.gz dist/SHA256SUMS
      # homebrew-tap 은 매시간 스스로 새 릴리스를 확인한다. HOMEBREW_TAP_TOKEN
      # (homebrew-tap 에만 Actions: read and write 권한이 있는 fine-grained token)이
      # 있으면 기다리지 않고 바로 formula 갱신을 시작시킨다.
      - name: update Homebrew formula now
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the tap picks up the release within an hour."
            exit 0
          fi
          GH_TOKEN="$TAP_TOKEN" gh workflow run update-formulae.yml -R horyu1234/homebrew-tap -f formula=routebox
